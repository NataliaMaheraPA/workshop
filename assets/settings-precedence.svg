<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" font-family="Manrope, system-ui, sans-serif">
<title>Пріоритет налаштувань Claude Code</title>
<desc>П'ять рівнів налаштувань, від глобального внизу до managed угорі.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<g stroke-width="1">
<rect x="150" y="36" width="430" height="54" rx="8" fill="var(--line,#2A3230)" stroke="var(--muted,#8B9A94)"/>
<rect x="150" y="102" width="430" height="54" rx="8" fill="none" stroke="var(--line,#2A3230)"/>
<rect x="150" y="168" width="430" height="54" rx="8" fill="none" stroke="var(--accent,#6EE7A0)"/>
<rect x="150" y="234" width="430" height="54" rx="8" fill="none" stroke="var(--accent,#6EE7A0)"/>
<rect x="150" y="300" width="430" height="54" rx="8" fill="none" stroke="var(--line,#2A3230)"/>
</g>
<g text-anchor="middle" fill="var(--fg,#E8EDEA)" font-size="16" font-weight="500">
<text x="365" y="58">Managed settings</text>
<text x="365" y="124">CLI-прапорці</text>
<text x="365" y="190" font-family="'Space Mono', monospace" font-size="15">.claude/settings.local.json</text>
<text x="365" y="256" font-family="'Space Mono', monospace" font-size="15">.claude/settings.json</text>
<text x="365" y="322" font-family="'Space Mono', monospace" font-size="15">~/.claude/settings.json</text>
</g>
<g text-anchor="middle" fill="var(--muted,#8B9A94)" font-size="13">
<text x="365" y="78">деплоїть IT, не перекриє ніхто</text>
<text x="365" y="144">лише поточна сесія</text>
<text x="365" y="210">особистий, у gitignore</text>
<text x="365" y="276">командний, комітиться в репо</text>
<text x="365" y="342">глобальний, ваша база</text>
</g>
<line x1="100" y1="336" x2="100" y2="56" stroke="var(--accent,#6EE7A0)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="88" y="200" text-anchor="end" fill="var(--muted,#8B9A94)" font-size="13">пріоритет</text>
</svg>
