<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="100%" role="img" font-family="Manrope, system-ui, sans-serif">
<title>Передача контексту між сесіями через handoff</title>
<desc>Повна сесія стискається в короткий документ, нова сесія стартує легкою.</desc>
<defs><marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<rect x="40" y="60" width="170" height="80" rx="8" fill="var(--line,#2A3230)" stroke="var(--muted,#8B9A94)"/>
<text x="125" y="94" text-anchor="middle" fill="var(--fg,#E8EDEA)" font-size="15" font-weight="500">Сесія 1</text>
<text x="125" y="116" text-anchor="middle" fill="var(--warn,#E8A33D)" font-size="13">контекст майже повний</text>
<line x1="216" y1="100" x2="268" y2="100" stroke="var(--muted,#8B9A94)" stroke-width="1.5" marker-end="url(#ar3)"/>
<rect x="275" y="60" width="170" height="80" rx="8" fill="none" stroke="var(--accent,#6EE7A0)"/>
<text x="360" y="90" text-anchor="middle" fill="var(--fg,#E8EDEA)" font-size="14" font-family="'Space Mono', monospace">/handoff</text>
<text x="360" y="112" text-anchor="middle" fill="var(--muted,#8B9A94)" font-size="13">рішення, стан, що далі</text>
<line x1="451" y1="100" x2="503" y2="100" stroke="var(--muted,#8B9A94)" stroke-width="1.5" marker-end="url(#ar3)"/>
<rect x="510" y="60" width="130" height="80" rx="8" fill="none" stroke="var(--muted,#8B9A94)"/>
<text x="575" y="94" text-anchor="middle" fill="var(--fg,#E8EDEA)" font-size="15" font-weight="500">Сесія 2</text>
<text x="575" y="116" text-anchor="middle" fill="var(--accent,#6EE7A0)" font-size="13">легка, але в курсі</text>
<text x="340" y="190" text-anchor="middle" fill="var(--fg,#E8EDEA)" font-size="14">Ви самі вирішуєте, що передати далі — на відміну від автостискання</text>
</svg>
